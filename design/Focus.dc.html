<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a98bf5; } a:hover { color: #c3adfa; }
    .fc { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .mn { font-family: 'Space Mono', ui-monospace, monospace; }
  </style>
</helmet>

<div class="fc" style="position: relative; width: 1240px; height: 800px; box-sizing: border-box; overflow: hidden; color: #e6e3ee; background: radial-gradient(80% 60% at 50% 74%, oklch(0.23 0.045 300) 0%, oklch(0.145 0.018 285) 62%, oklch(0.115 0.012 285) 100%);">

  <!-- top status -->
  <div style="position: absolute; left: 0; top: 0; width: 1240px; box-sizing: border-box; padding: 18px 40px 0; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="mn" style="font-size: 12px; color: #6f6a83;">#23</span>
      <span class="mn" style="font-size: 12px; color: #6f6a83;">5/10</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="mn" style="font-size: 13px; color: #7ecf95;">+240</span>
      <div style="display: flex; align-items: center; gap: 5px; border: 1px solid #322c46; border-radius: 999px; padding: 4px 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b84a3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4 L5 12 L13 20"></path><path d="M20 4 L12 12 L20 20"></path></svg>
        <span class="mn" style="font-size: 11px; color: #8b84a3;">1x</span>
      </div>
    </div>
  </div>

  <!-- opponent strip -->
  <div style="position: absolute; left: 50%; top: 56px; transform: translateX(-50%); display: flex; gap: 10px;">
    <div style="width: 168px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid #2c2740; padding: 10px 12px 11px; opacity: 0.36;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 13px; font-weight: 500;">Holly</span><span class="mn" style="font-size: 9.5px; color: #6f6a83;">UTG</span></div>
      <div class="mn" style="font-size: 15px; margin-top: 3px; color: #cfcada;">420</div>
      <div class="mn" style="font-size: 10.5px; color: #6f6a83; margin-top: 4px;">FOLD</div>
    </div>
    <div style="width: 168px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid #3a3352; padding: 10px 12px 11px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 13px; font-weight: 500;">Scarlet</span><span class="mn" style="font-size: 9.5px; color: #6f6a83;">MP</span></div>
      <div class="mn" style="font-size: 15px; margin-top: 3px; color: #f0edf7;">945</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;"><span class="mn" style="font-size: 10.5px; color: #a29ab8;">CALL</span><span class="mn" style="font-size: 11px; color: #e6e3ee;">40</span></div>
    </div>
    <div style="width: 168px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid #2c2740; padding: 10px 12px 11px; opacity: 0.36;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 13px; font-weight: 500;">Lars</span><span class="mn" style="font-size: 9.5px; color: #6f6a83;">CO</span></div>
      <div class="mn" style="font-size: 15px; margin-top: 3px; color: #cfcada;">1,195</div>
      <div class="mn" style="font-size: 10.5px; color: #6f6a83; margin-top: 4px;">FOLD</div>
    </div>
    <div style="width: 168px; box-sizing: border-box; border-radius: 12px; background: rgba(169,139,245,0.1); border: 1px solid #a98bf5; padding: 10px 12px 11px; box-shadow: 0 0 26px rgba(169,139,245,0.22);">
      <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 13px; font-weight: 500;">Chip</span><span class="mn" style="font-size: 9.5px; color: #a98bf5;">SB</span></div>
      <div class="mn" style="font-size: 15px; margin-top: 3px; color: #f0edf7;">820</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;"><span class="mn" style="font-size: 10.5px; color: #a98bf5;">BET</span><span class="mn" style="font-size: 11px; color: #e6e3ee;">40</span></div>
    </div>
    <div style="width: 168px; box-sizing: border-box; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid #2c2740; padding: 10px 12px 11px; opacity: 0.36;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;"><span style="font-size: 13px; font-weight: 500;">Darla</span><span class="mn" style="font-size: 9.5px; color: #6f6a83;">BB</span></div>
      <div class="mn" style="font-size: 15px; margin-top: 3px; color: #cfcada;">1,505</div>
      <div class="mn" style="font-size: 10.5px; color: #6f6a83; margin-top: 4px;">FOLD</div>
    </div>
  </div>

  <!-- board zone -->
  <div style="position: absolute; left: 50%; top: 196px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 20px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="width: 46px; height: 1px; background: #3a3352;"></span>
      <span class="mn" style="font-size: 11px; letter-spacing: 3.4px; color: #a98bf5;">FLOP</span>
      <span style="width: 46px; height: 1px; background: #3a3352;"></span>
    </div>
    <div style="display: flex; gap: 12px;">
      <div style="width: 82px; height: 116px; border-radius: 10px; background: #f7f5fb; box-shadow: 0 10px 26px rgba(0,0,0,0.45); box-sizing: border-box; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-size: 30px; line-height: 1; font-weight: 700; color: #d0425e;">9</span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#d0425e" style="align-self: flex-end;"><path d="M12 21S3 14.6 3 9.1A4.9 4.9 0 0 1 12 6.2 4.9 4.9 0 0 1 21 9.1c0 5.5-9 11.9-9 11.9z"></path></svg>
      </div>
      <div style="width: 82px; height: 116px; border-radius: 10px; background: #f7f5fb; box-shadow: 0 10px 26px rgba(0,0,0,0.45); box-sizing: border-box; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-size: 30px; line-height: 1; font-weight: 700; color: #16141d;">7</span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#16141d" style="align-self: flex-end;"><path d="M12 2c0 0-9 6.6-9 11.6a4.5 4.5 0 0 0 7.9 2.9c-.4 2.3-1.3 3.8-2.5 4.8h7.2c-1.2-1-2.1-2.5-2.5-4.8A4.5 4.5 0 0 0 21 13.6C21 8.6 12 2 12 2z"></path></svg>
      </div>
      <div style="width: 82px; height: 116px; border-radius: 10px; background: #f7f5fb; box-shadow: 0 10px 26px rgba(0,0,0,0.45); box-sizing: border-box; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between;">
        <span style="font-size: 30px; line-height: 1; font-weight: 700; color: #16141d;">2</span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#16141d" style="align-self: flex-end;"><circle cx="12" cy="6.6" r="4.1"></circle><circle cx="6.6" cy="14.4" r="4.1"></circle><circle cx="17.4" cy="14.4" r="4.1"></circle><path d="M10.6 13.4h2.8c0 4.3.2 6.2 2.1 8.2H8.5c1.9-2 2.1-3.9 2.1-8.2z"></path></svg>
      </div>
      <div style="width: 82px; height: 116px; border-radius: 10px; border: 1.5px dashed #322c46; box-sizing: border-box;"></div>
      <div style="width: 82px; height: 116px; border-radius: 10px; border: 1.5px dashed #322c46; box-sizing: border-box;"></div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 14px;">
      <span class="mn" style="font-size: 11px; letter-spacing: 2.4px; color: #6f6a83;">POT</span>
      <span style="font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -1.4px; color: #f0edf7;">$115</span>
      <span class="mn" style="font-size: 12px; color: #6f6a83;">+80 in play</span>
    </div>
  </div>

  <!-- hero zone -->
  <div style="position: absolute; left: 0; bottom: 0; width: 1240px; box-sizing: border-box; padding: 22px 40px 26px; background: linear-gradient(180deg, rgba(20,17,30,0) 0%, rgba(20,17,30,0.85) 34%, oklch(0.155 0.020 290) 100%); display: flex; flex-direction: column; align-items: center; gap: 16px;">

    <div style="width: 780px; display: flex; align-items: center; gap: 22px;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 78px; height: 110px; border-radius: 10px; background: #f7f5fb; box-shadow: 0 10px 26px rgba(0,0,0,0.5); box-sizing: border-box; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between;">
          <span style="font-size: 30px; line-height: 1; font-weight: 700; color: #16141d;">A</span>
          <svg width="27" height="27" viewBox="0 0 24 24" fill="#16141d" style="align-self: flex-end;"><path d="M12 2c0 0-9 6.6-9 11.6a4.5 4.5 0 0 0 7.9 2.9c-.4 2.3-1.3 3.8-2.5 4.8h7.2c-1.2-1-2.1-2.5-2.5-4.8A4.5 4.5 0 0 0 21 13.6C21 8.6 12 2 12 2z"></path></svg>
        </div>
        <div style="width: 78px; height: 110px; border-radius: 10px; background: #f7f5fb; box-shadow: 0 10px 26px rgba(0,0,0,0.5); box-sizing: border-box; padding: 10px 11px; display: flex; flex-direction: column; justify-content: space-between;">
          <span style="font-size: 30px; line-height: 1; font-weight: 700; color: #d0425e;">K</span>
          <svg width="27" height="27" viewBox="0 0 24 24" fill="#d0425e" style="align-self: flex-end;"><path d="M12 2l9 10-9 10-9-10z"></path></svg>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <span style="font-size: 14px; font-weight: 500;">You</span>
          <span class="mn" style="font-size: 10px; letter-spacing: 1px; color: #16141d; background: #e6e3ee; border-radius: 4px; padding: 2px 6px;">BTN</span>
        </div>
        <span style="font-size: 27px; font-weight: 700; line-height: 1.05; letter-spacing: -0.8px;">$1,240</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; gap: 22px;">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
          <span class="mn" style="font-size: 10px; letter-spacing: 1.6px; color: #6f6a83;">TO CALL</span>
          <span class="mn" style="font-size: 19px; color: #f0edf7;">$40</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
          <span class="mn" style="font-size: 10px; letter-spacing: 1.6px; color: #6f6a83;">POT ODDS</span>
          <span class="mn" style="font-size: 19px; color: #a98bf5;">17%</span>
        </div>
      </div>
    </div>

    <div style="width: 780px; display: flex; align-items: center; gap: 14px;">
      <div style="position: relative; flex-grow: 1; height: 8px; border-radius: 4px; background: #2a2440;">
        <span style="display: block; width: 38%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #7b5fd6, #a98bf5);"></span>
        <span style="position: absolute; left: 38%; top: 50%; transform: translate(-50%,-50%); width: 26px; height: 26px; border-radius: 50%; background: #f0edf7; box-shadow: 0 3px 10px rgba(0,0,0,0.55);"></span>
      </div>
      <div style="display: flex; gap: 7px;">
        <span class="mn" style="padding: 7px 13px; border-radius: 8px; border: 1px solid #322c46; font-size: 11.5px; color: #a29ab8;">MIN</span>
        <span class="mn" style="padding: 7px 13px; border-radius: 8px; border: 1px solid #322c46; font-size: 11.5px; color: #a29ab8;">½</span>
        <span class="mn" style="padding: 7px 13px; border-radius: 8px; border: 1px solid #a98bf5; background: rgba(169,139,245,0.14); font-size: 11.5px; color: #c3adfa;">¾</span>
        <span class="mn" style="padding: 7px 13px; border-radius: 8px; border: 1px solid #322c46; font-size: 11.5px; color: #a29ab8;">POT</span>
        <span class="mn" style="padding: 7px 13px; border-radius: 8px; border: 1px solid #322c46; font-size: 11.5px; color: #a29ab8;">MAX</span>
      </div>
    </div>

    <div style="width: 780px; display: flex; gap: 12px;">
      <div style="width: 168px; height: 68px; box-sizing: border-box; border-radius: 14px; border: 1.5px solid #6d3a4a; background: rgba(208,66,94,0.09); display: flex; align-items: center; justify-content: center; gap: 9px;">
        <span style="font-size: 16px; font-weight: 700; color: #e88097;">Fold</span>
        <span class="mn" style="font-size: 10.5px; color: #8a5666;">F</span>
      </div>
      <div style="flex-grow: 1; height: 68px; box-sizing: border-box; border-radius: 14px; background: rgba(255,255,255,0.07); border: 1.5px solid #4a4266; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <span style="font-size: 16px; font-weight: 700;">Call</span>
        <span class="mn" style="font-size: 17px; color: #f0edf7;">$40</span>
        <span class="mn" style="font-size: 10.5px; color: #8b84a3;">C</span>
      </div>
      <div style="flex-grow: 1; height: 68px; box-sizing: border-box; border-radius: 14px; background: linear-gradient(180deg, #a98bf5, #7b5fd6); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 24px rgba(123,95,214,0.35);">
        <span style="font-size: 16px; font-weight: 700; color: #150f26;">Raise to</span>
        <span class="mn" style="font-size: 17px; font-weight: 700; color: #150f26;">$135</span>
        <span class="mn" style="font-size: 10.5px; color: rgba(21,15,38,0.55);">R</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
