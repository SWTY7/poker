<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #a98bf5; } a:hover { color: #c3adfa; }
    .fc { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .mn { font-family: 'Space Mono', ui-monospace, monospace; }
    .dn { font-family: 'Bebas Neue', 'Space Grotesk', system-ui, sans-serif; }
  </style>
</helmet>

<div class="fc" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; color: #f3f0fa; background:
    radial-gradient(110% 30% at 50% 0%, oklch(0.27 0.025 300 / 0.26) 0%, transparent 45%),
    radial-gradient(95% 46% at 50% 84%, oklch(0.22 0.028 295) 0%, oklch(0.15 0.016 285) 58%, oklch(0.10 0.012 285) 100%);
    padding: 56px 20px 34px; display: flex; flex-direction: column; align-items: center; overflow-y: auto;">

  <div style="position: absolute; inset: 0; opacity: 0.05; background-image: repeating-linear-gradient(135deg, #ffffff 0px, #ffffff 1px, transparent 1px, transparent 26px); pointer-events: none;"></div>
  <svg width="300" height="300" viewBox="0 0 24 24" fill="#a98bf5" style="position: absolute; left: -90px; top: -50px; opacity: 0.05; transform: rotate(-12deg);"><path d="M12 2c0 0-9 6.6-9 11.6a4.5 4.5 0 0 0 7.9 2.9c-.4 2.3-1.3 3.8-2.5 4.8h7.2c-1.2-1-2.1-2.5-2.5-4.8A4.5 4.5 0 0 0 21 13.6C21 8.6 12 2 12 2z"></path></svg>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 26px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="#c9a24a" style="opacity: 0.8;"><path d="M12 12L9 20.6h6z"></path><rect x="9.5" y="19.4" width="5" height="2.4" rx="0.7"></rect><circle cx="12" cy="7.6" r="3.9"></circle><circle cx="7.9" cy="13.2" r="3.9"></circle><circle cx="16.1" cy="13.2" r="3.9"></circle></svg>
      <span class="dn" style="font-size: 34px; line-height: 1; letter-spacing: 2px; color: #f6f2fe;">TEXAS <span style="color: #a98bf5;">HOLD&rsquo;EM</span></span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="#c9a24a" style="opacity: 0.8;"><path d="M12 2l9 10-9 10-9-10z"></path></svg>
    </div>
    <span style="font-size: 12.5px; color: #9891ab;">Set up the table, then deal yourself in.</span>
  </div>

  <div style="position: relative; width: 100%; max-width: 350px; box-sizing: border-box; border-radius: 20px; background: rgba(255,255,255,0.035); backdrop-filter: blur(18px); border: 1px solid #342e4c; box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05) inset; padding: 24px 22px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <div style="width: 27px; height: 27px; border-radius: 8px; background: rgba(169,139,245,0.12); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a98bf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M15.5 14.2c2.6.3 4.5 2.4 4.5 5.8"></path></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Players</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px;">
        <button style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3f3859; background: rgba(255,255,255,0.03); color: #cfcada; font-size: 16px;">&minus;</button>
        <span class="mn" style="font-size: 17px; width: 18px; text-align: center;">6</span>
        <button style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #a98bf5; background: rgba(169,139,245,0.14); color: #c3adfa; font-size: 16px;">+</button>
      </div>
    </div>

    <div style="height: 1px; background: #2c2740;"></div>

    <div>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 27px; height: 27px; border-radius: 8px; background: rgba(169,139,245,0.12); display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a98bf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.6"></circle><path d="M5 20c0-4 3-6.6 7-6.6s7 2.6 7 6.6"></path></svg>
          </div>
          <span style="font-size: 13.5px; font-weight: 500;">Human players</span>
        </div>
        <div style="display: flex; align-items: center; gap: 14px;">
          <button style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3f3859; background: rgba(255,255,255,0.03); color: #cfcada; font-size: 16px;">&minus;</button>
          <span class="mn" style="font-size: 17px; width: 18px; text-align: center;">1</span>
          <button style="width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3f3859; background: rgba(255,255,255,0.03); color: #cfcada; font-size: 16px;">+</button>
        </div>
      </div>
      <div style="font-size: 11px; color: #7d7791; margin-top: 7px; margin-left: 36px;">Just you, against the rest at the table.</div>
    </div>

    <div style="height: 1px; background: #2c2740;"></div>

    <div>
      <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px;">
        <div style="width: 27px; height: 27px; border-radius: 8px; background: rgba(201,162,74,0.14); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4.5"></circle><line x1="12" y1="1.5" x2="12" y2="4.5" stroke-linecap="round"></line><line x1="12" y1="19.5" x2="12" y2="22.5" stroke-linecap="round"></line><line x1="1.5" y1="12" x2="4.5" y2="12" stroke-linecap="round"></line><line x1="19.5" y1="12" x2="22.5" y2="12" stroke-linecap="round"></line></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Starting stack</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$500</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #a98bf5; background: rgba(169,139,245,0.14); font-size: 12.5px; color: #c3adfa;">$1,000</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$2,500</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$5,000</span>
      </div>
    </div>

    <div>
      <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px;">
        <div style="width: 27px; height: 27px; border-radius: 8px; background: rgba(201,162,74,0.14); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="9" r="6"></circle><circle cx="16" cy="15" r="6"></circle></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Blinds</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$1/$2</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #a98bf5; background: rgba(169,139,245,0.14); font-size: 12.5px; color: #c3adfa;">$5/$10</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$25/$50</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12.5px; color: #a29ab8;">$100/$200</span>
      </div>
    </div>

    <div>
      <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px;">
        <div style="width: 27px; height: 27px; border-radius: 8px; background: rgba(201,162,74,0.14); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c9a24a" stroke-width="2"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5v9M9.3 15.3c0 1.1 1.1 1.7 2.7 1.7s2.7-.7 2.7-1.9c0-2.6-5.4-1.2-5.4-3.7 0-1.2 1.1-1.9 2.7-1.9s2.7.6 2.7 1.7" stroke-linecap="round"></path></svg>
        </div>
        <span style="font-size: 13.5px; font-weight: 500;">Ante</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px;">
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #a98bf5; background: rgba(169,139,245,0.14); font-size: 12px; color: #c3adfa;">None</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12px; color: #a29ab8;">$1</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12px; color: #a29ab8;">$5</span>
        <span class="mn" style="text-align: center; padding: 9px 0; border-radius: 9px; border: 1px solid #322c46; font-size: 12px; color: #a29ab8;">$25</span>
      </div>
    </div>

    <div style="margin-top: 4px; height: 54px; border-radius: 13px; background: linear-gradient(180deg, #b79cf7 0%, #8b6ef0 45%, #6a4bc4 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.35) inset, 0 12px 28px rgba(107,79,196,0.4); display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#150f26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="17" rx="2" transform="rotate(-8 9 13)"></rect><rect x="8" y="4" width="13" height="17" rx="2"></rect></svg>
      <span style="font-size: 15.5px; font-weight: 700; color: #150f26;">Deal me in</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
