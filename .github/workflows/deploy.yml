name: Deploy to GitHub Pages

# Deploys only when asked, not on every merge (CI checks those, see ci.yml):
#   - push a version tag:  git tag v1.4.0 && git push origin v1.4.0
#   - or Actions -> Deploy to GitHub Pages -> Run workflow (choose main or a tag)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # The home game's room server (server/, a Cloudflare Worker). Set it as a
          # repository variable once the Worker is deployed: gh variable set ROOM_SERVER
          VITE_ROOM_SERVER: ${{ vars.ROOM_SERVER }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
